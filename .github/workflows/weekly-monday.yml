# 周一 10:30 Asia/Shanghai = 02:30 UTC
name: AirBrush Monday KB + Weekly Report

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-cloud-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required secrets
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OMNIBUS_ACCESS_TOKEN: ${{ secrets.OMNIBUS_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ok=1
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::error title=Missing GitHub Secret::CURSOR_API_KEY 未配置。打开 https://github.com/yunhuixu-prog/winne/settings/secrets/actions 添加（从 https://cursor.com/dashboard/api 生成）。"
            ok=0
          else
            echo "CURSOR_API_KEY: present (len=${#CURSOR_API_KEY})"
          fi
          if [ -z "${OMNIBUS_ACCESS_TOKEN:-}" ]; then
            echo "::warning title=Optional secret missing::OMNIBUS_ACCESS_TOKEN 未配置；云端北斗/CF 拉取可能失败。建议一并添加。"
          else
            echo "OMNIBUS_ACCESS_TOKEN: present (len=${#OMNIBUS_ACCESS_TOKEN})"
          fi
          [ "$ok" = 1 ]

      - name: Trigger Cursor Cloud Agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OMNIBUS_ACCESS_TOKEN: ${{ secrets.OMNIBUS_ACCESS_TOKEN }}
          CURSOR_REPO_URL: https://github.com/yunhuixu-prog/winne
          CURSOR_STARTING_REF: main
        run: |
          set -euo pipefail
          python3 app/AB-OCI/专项/AI周报月报/定时任务/scripts/trigger_cloud_agent.py --task monday
